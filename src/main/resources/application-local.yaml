spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope:
              - openid
              - email
              - profile
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/facebook"
            scope:
              - email
              - public_profile
        provider:
          facebook:
            authorization-uri: https://www.facebook.com/v16.0/dialog/oauth
            token-uri: https://graph.facebook.com/v16.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/v16.0/me?fields=id,name,email,picture.type(large)
            user-name-attribute: id

  application:
    name: huddey
  datasource:
    url: jdbc:postgresql://localhost:5432/huddey_core
    username: postgres
    password: dev_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate:
        default_schema: huddey_core
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/huddey_core
    user: postgres
    password: dev_password
    default-schema: huddey_core

logging:
  level:
    org.springframework.security: DEBUG
    com.huddey.core.userman.auth.oauth2: DEBUG

server:
  port: 8080
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: jcraft
    key-alias: jcraft-local
    key-store-type: PKCS12
  servlet:
    context-path: /huddey

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      accessTokenValidity: 3600000  # 1 hour
      refreshTokenValidity: 86400000 # 24 hours
      rememberMeAccessTokenValidity:  432000000 # 5 days
      rememberMeRefreshTokenValidity:  604800000 # 7 days