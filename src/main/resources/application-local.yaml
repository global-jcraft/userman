spring:
  threads:
    virtual:
      enabled: true
  web:
    server:
      tomcat:
        threads:
          virtual: true
  task:
    execution:
      pool:
        core-size: 50
        max-size: 100
        queue-capacity: 500
        keep-alive: 60s
      thread-name-prefix: huddey-core-
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope:
              - openid
              - email
              - profile
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/facebook"
            scope:
              - email
              - public_profile
        provider:
          facebook:
            authorization-uri: https://www.facebook.com/v16.0/dialog/oauth
            token-uri: https://graph.facebook.com/v16.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/v16.0/me?fields=id,name,email,picture.type(large)
            user-name-attribute: id

  application:
    name: huddey
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/huddey_core?reWriteBatchedInserts=true&cachePrepStmts=true&useServerPrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&maxResultBuffer=20971520&sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver
    # HikariCP Configuration - Optimized for 500 concurrent users with virtual threads
    hikari:
      auto-commit: false
      # Connection pool name
      pool-name: HikariPool-Local

      # Maximum number of connections in the pool
      # Reduced since PgBouncer handles connection pooling
      maximum-pool-size: 75

      # Minimum idle connections to maintain
      minimum-idle: 25

      # Maximum time (ms) to wait for a connection from the pool
      connection-timeout: 2000

      # Maximum idle time (ms) for a connection
      idle-timeout: 600000

      # Maximum lifetime (ms) of a connection in the pool
      max-lifetime: 1800000

      # Time (ms) to attempt to keep a connection alive
      keepalive-time: 300000

      # Validation timeout (ms)
      validation-timeout: 250

      # Leak detection threshold (ms) - helps identify connection leaks
      leak-detection-threshold: 5000

      # Connection init SQL
      connection-init-sql: "SET TIME ZONE 'UTC'"

      # Connection test query
      connection-test-query: "SELECT 1"

      data-source-properties:
        # PostgreSQL specific optimizations
        preparedStatementCacheQueries: 256
        preparedStatementCacheSizeMiB: 5
        cachePrepStmts: true
        useServerPrepStmts: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: huddey_core
        jdbc:
          batch_size: 50
          batch_versioned_data: true
          order_inserts: true
          order_updates: true
        query:
          plan_cache_max_size: 2048
          plan_parameter_metadata_max_size: 32
          in_clause_parameter_padding: true

          # Connection handling
        connection:
          provider_disables_autocommit: true
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION

        # Statistics (disable in production)
        generate_statistics: false

        # Second level cache
        cache:
          use_second_level_cache: false
          use_query_cache: false
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory

        # Misc optimizations
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/huddey_core?reWriteBatchedInserts=true&cachePrepStmts=true&useServerPrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&maxResultBuffer=20971520}
    user: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:dev_password}
    default-schema: huddey_core
    postgresql:
      transactional-lock: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 1 hour
      cache-null-values: false
      enable-statistics: true

# Additional performance tuning with virtual threads
spring.task.execution.pool:
  core-size: 0  # Not needed with virtual threads
  max-size: 1000000000  # Unlimited with virtual threads
  queue-capacity: 0  # Not needed with virtual threads
  thread-name-prefix: "virtual-exec-"
  use-virtual-threads: true

# Virtual thread scheduler configuration
spring.threads.virtual:
  enabled: true
  scheduler:
    core-pool-size: 8  # Number of carrier threads
    max-pool-size: 256
    keep-alive-seconds: 60

server:
  port: 8080
  tomcat:
    threads:
      max: 300  # Optimized for performance
      min-spare: 100
    accept-count: 100
    max-connections: 8000
    connection-timeout: 5000
    keep-alive-timeout: 10000
    max-keep-alive-requests: 50
    # Use virtual threads for request processing
    use-virtual-threads: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
  http2:
    enabled: true
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: jcraft
    key-alias: jcraft-local
    key-store-type: PKCS12
  servlet:
    context-path: /huddey

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,hikaricp
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  health:
    show-details: always
    db:
      enabled: true
    diskspace:
      enabled: true

app:
  frontend:
    successUrl: http://localhost:8080/payment-methods?success=true
    cancelUrl: http://localhost:8080/payment-methods?canceled=true
  confirmation:
    baseUrl: https://localhost:8080/huddey/api/v1/auth/
  security:
    jwt:
      secret: ${JWT_SECRET}
      accessTokenValidity: 3600000  # 1 hour
      refreshTokenValidity: 86400000 # 24 hours
      rememberMeAccessTokenValidity:  432000000 # 5 days
      rememberMeRefreshTokenValidity:  604800000 # 7 days
  phone:
    verification:
      token:
        expiry:
          minutes: 10
aws:
