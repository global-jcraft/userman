spring:
  threads:
    virtual:
      enabled: true
  web:
    server:
      tomcat:
        threads:
          virtual: true
  task:
    execution:
      pool:
        core-size: 50
        max-size: 100
        queue-capacity: 500
        keep-alive: 60s
      thread-name-prefix: huddey-core-
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope:
              - openid
              - email
              - profile
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/facebook"
            scope:
              - email
              - public_profile
        provider:
          facebook:
            authorization-uri: https://www.facebook.com/v16.0/dialog/oauth
            token-uri: https://graph.facebook.com/v16.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/v16.0/me?fields=id,name,email,picture.type(large)
            user-name-attribute: id

  application:
    name: huddey
  datasource:
    url: jdbc:postgresql://localhost:5432/huddey_core?reWriteBatchedInserts=true&cachePrepStmts=true&useServerPrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&maxResultBuffer=20971520
    username: postgres
    password: dev_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100              # Increased for high concurrency
      minimum-idle: 20                    # Higher baseline connections
      idle-timeout: 300000               # 5 minutes
      connection-timeout: 30000          # 30 seconds
      max-lifetime: 1800000             # 30 minutes
      keepalive-time: 60000             # 1 minute
      validation-timeout: 5000          # 5 seconds
      leak-detection-threshold: 60000   # 1 minute
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate:
        default_schema: huddey_core
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/huddey_core
    user: postgres
    password: dev_password
    default-schema: huddey_core

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    org.springframework.security: DEBUG
    com.huddey.core.userman.auth.oauth2: DEBUG

server:
  port: 8080
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: jcraft
    key-alias: jcraft-local
    key-store-type: PKCS12
  servlet:
    context-path: /huddey

app:
  confirmation:
    baseUrl: https://localhost:8080/huddey/api/v1/auth/
  security:
    jwt:
      secret: ${JWT_SECRET}
      accessTokenValidity: 3600000  # 1 hour
      refreshTokenValidity: 86400000 # 24 hours
      rememberMeAccessTokenValidity:  432000000 # 5 days
      rememberMeRefreshTokenValidity:  604800000 # 7 days
  phone:
    verification:
      token:
        expiry:
          minutes: 10
aws:
  region: us-east-1
  endpoint:
    ses: http://localhost:4566
  ses:
    from: test@localstack.com
  sns:
    topic-arn: arn:aws:sns:us-east-1:000000000000:sms-notifications
    localstack:
      endpoint: http://localhost:4566