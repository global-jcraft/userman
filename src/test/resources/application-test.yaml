spring:
  application:
    name: huddey
  datasource:
    url: jdbc:postgresql://localhost:5432/huddey_core
    username: postgres
    password: dev_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/huddey_core
    user: postgres
    password: dev_password
    default-schema: huddey_core

server:
  servlet:
    context-path: /huddey

app:
  security:
    jwt:
      secret: UOX0OVVAS2ZPV5ONRLGOO6TB5KTFWCUJIMSMGS7H4JFFKI3D37LV4G5XLZ1JTG0M
      accessTokenValidity: 3600000  # 1 hour
      refreshTokenValidity: 86400000 # 24 hours
      rememberMeAccessTokenValidity: 432000000 # 5 days
      rememberMeRefreshTokenValidity: 604800000 # 7 days