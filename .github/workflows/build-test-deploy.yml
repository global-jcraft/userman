name: Build, Test, and Deploy

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build the Project
        run: |
          # Set testcontainers properties
          export TESTCONTAINERS_RYUK_DISABLED=true
          export TESTCONTAINERS_CHECKS_DISABLE=true

          ./gradlew build

  spotless:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Check and Apply Formatting with Spotless
        run: |
          ./gradlew spotlessCheck || (echo "Spotless check failed. Fixing issues..." && ./gradlew spotlessApply)

  code-quality:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better SonarQube analysis

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run Tests with Coverage
        run: |
          export TESTCONTAINERS_RYUK_DISABLED=true
          export TESTCONTAINERS_CHECKS_DISABLE=true

          ./gradlew test jacocoTestReport

      - name: SonarQube Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_GITHUB_AUTH_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ./gradlew sonar \
              -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml \
              -Dsonar.junit.reportPaths=build/test-results/test \
              -Dsonar.tests=src/test/java \
              -Dsonar.test.inclusions=**/*Test.java \
              -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
              -Dsonar.pullrequest.branch=${{ github.head_ref }} \
              -Dsonar.pullrequest.base=${{ github.base_ref }} \
              -Dsonar.scm.provider=git
          else
            ./gradlew sonarqube \
              -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml \
              -Dsonar.junit.reportPaths=build/test-results/test \
              -Dsonar.tests=src/test/java \
              -Dsonar.test.inclusions=**/*Test.java \
              -Dsonar.branch.name=${{ github.ref_name }}
          fi

  unit-tests:
    runs-on: ubuntu-latest
    needs: [ build, spotless, code-quality ]
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run Unit Tests
        run: |
          export TESTCONTAINERS_RYUK_DISABLED=true
          export TESTCONTAINERS_CHECKS_DISABLE=true

          ./gradlew test --info

      - name: Upload Test Results
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: build/test-results/test

      - name: Upload Test Reports
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: build/reports/tests

  package:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Package the Application
        run: ./gradlew clean bootJar

      - name: Upload JAR
        uses: actions/upload-artifact@v3
        with:
          name: app-jar
          path: build/libs

  docker-build:
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v3

      - name: Download JAR
        uses: actions/download-artifact@v3
        with:
          name: app-jar
          path: build/libs

      - name: Prepare Version
        id: prep
        run: |
          VERSION=$(./gradlew properties -q | grep "^version:" | awk '{print $2}')
          VERSION=${VERSION:-1.0.0}  # Use default version 1.0.0 if empty
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/jcraft-userman:${{ steps.prep.outputs.version }}
          build-args: |
            VERSION=${{ steps.prep.outputs.version }}

  snyk-scan:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v3

      - name: Run Snyk to check Docker image for vulnerabilities
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ secrets.DOCKER_USERNAME }}/jcraft-userman:${{ needs.docker-build.outputs.version }}
          args: --file=Dockerfile --json-file-output=snyk-results.json
        continue-on-error: true

      - name: Upload Snyk results
        uses: actions/upload-artifact@v3
        with:
          name: snyk-results
          path: snyk-results.json

  deploy-develop:
    runs-on: ubuntu-latest
    needs: [ docker-build, snyk-scan ]
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Staging
        run: |
          if [ -f ./scripts/deploy.sh ]; then
            ./scripts/deploy.sh staging
          else
            echo "Warning: ./scripts/deploy.sh not found. Skipping deployment to staging."
          fi

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-develop
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Production
        run: |
          if [ -f ./scripts/deploy.sh ]; then
            ./scripts/deploy.sh production
          else
            echo "Warning: ./scripts/deploy.sh not found. Skipping deployment to production."
          fi