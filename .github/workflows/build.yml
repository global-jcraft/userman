name: Build, Test, Scan and Deploy Dev

on:
  push:
    branches:
      - master
      - develop
      - '**'
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  # 1. Harden & checkout & setup JDK (prep for build)
  setup:
    name: Prepare runner
    runs-on: ubuntu-latest
    outputs:
      gradle-cache-key: ${{ steps.cache-gradle.outputs.cache-hit }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.9.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@v4.1.6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        id: setup-java
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

  # 2. Build
  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.6

      - name: Build Project (compile)
        run: ./gradlew assemble


  # 3. SonarCloud scan
  sonar:
    name: SonarCloud Code Quality Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4.1.6
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=global-jcraft \
            -Dsonar.projectKey=global-jcraft_userman \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
          --info
  

  # 4. Spotless (format) check
  spotless:
    name: Spotless Check
    runs-on: ubuntu-latest
    needs: sonar
    steps:
      - uses: actions/checkout@v4.1.6
      - name: Spotless Check
        run: ./gradlew spotlessCheck

  # 5. Unit tests & coverage
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: spotless
    steps:
      - uses: actions/checkout@v4.1.6
      - name: Run Tests
        run: ./gradlew test

  # 6. Package (bootJar)
  package:
    name: Package Application
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4.1.6
      - name: Package JAR
        run: ./gradlew bootJar
      - name: Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: huddey-core-jar
          path: build/libs/huddey-core-*.jar

  # 7. Docker build
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: docker/setup-buildx-action@v3.3.0
      - uses: actions/checkout@v4.1.6
      - name: Build & Load Image
        id: docker_build
        uses: docker/build-push-action@v5.3.0
        with:
          context: .
          file: ./Dockerfile
          tags: localbuild/huddey-core:${{ github.sha }}
          load: true

  # 8a. Snyk: dependencies scan
  snyk-deps:
    name: Snyk Scan – Dependencies
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4.1.6
      - name: Snyk Scan – Application Dependencies
        uses: snyk/actions/gradle-jdk17@master
        with:
          command: monitor
          args: --all-sub-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # 8b. Snyk: docker-image scan
  snyk-docker:
    name: Snyk Scan – Docker Image
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.6

      - name: Run Snyk to check Docker image for vulnerabilities
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: localbuild/huddey-core:${{ github.sha }}
          args: --file=Dockerfile


  # 9. Deploy to Dev (only on develop)
  deploy-dev:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    needs: [snyk-deps, snyk-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Simulate Deployment
        run: |
          echo "Deploying huddey-core:${{ github.sha }} to Dev environment…"
          # real docker login/push or kubectl/helm steps here
