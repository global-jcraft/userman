# .github/workflows/build.yml

name: Build, Test, Scan and Deploy Dev

on:
  push:
    branches:
      - master
      - develop
      - '**' # Trigger on push to master, develop, AND any other branch
  pull_request:
    # Trigger on PRs targeting master or develop
    branches:
      - master
      - develop

permissions:
  contents: read
  pull-requests: write # Needed for SonarCloud PR decoration

jobs:
  build-scan-deploy: # This is the single JOB
    name: Build, Scan & Deploy # Display name for the JOB
    runs-on: ubuntu-latest

    # STEPS run sequentially within the JOB
    steps:
      - name: Harden Runner # STEP 1
        uses: step-security/harden-runner@v2.9.0
        with:
          egress-policy: audit # Start with audit, then consider block

      - name: Checkout Code # STEP 2
        uses: actions/checkout@v4.1.6
        with:
          fetch-depth: 0 # Important for SonarQube analysis

      - name: Set up JDK 17 # STEP 3
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew # STEP 4
        run: chmod +x ./gradlew

      # --- Build Steps ---
      - name: Build Project (Compile sources) # STEP 5 (Logical Group 1)
        run: ./gradlew assemble

      - name: SonarCloud Code Quality Scan # STEP 6 (Logical Group 2)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonarqube --info

      - name: Spotless Check # STEP 7 (Logical Group 3)
        run: ./gradlew spotlessCheck

      - name: Unit Tests & Coverage # STEP 8 (Logical Group 4)
        run: ./gradlew test

      - name: Package Application # STEP 9 (Logical Group 5)
        run: ./gradlew bootJar

      # --- Docker Steps ---
      - name: Set up Docker Buildx # STEP 10 (Logical Group 6)
        uses: docker/setup-buildx-action@v3.3.0

      - name: Docker Build # STEP 11 (Logical Group 6)
        id: docker_build
        uses: docker/build-push-action@v5.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: localbuild/huddey-core:${{ github.sha }}
          load: true

      # --- Security Scan ---
      - name: Snyk Scan - Application Dependencies # STEP 12 (Logical Group 7)
        uses: snyk/actions/gradle@v0.9.0 # Updated tag
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-sub-projects
          command: monitor

      - name: Snyk Scan - Docker Image # STEP 13 (Logical Group 7)
        uses: snyk/actions/docker@v0.9.0 # Updated tag
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: localbuild/huddey-core:${{ github.sha }}
          args: --file=Dockerfile

      # --- Deployment Step ---
      - name: Deploy to Dev Environment (Dummy) # STEP 14 (Logical Group 8)
        # Deploying from 'develop' branch - ADJUST IF NEEDED
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          echo "Simulating deployment to Dev environment from 'develop' branch..."
          echo "Artifact: build/libs/huddey-core-*.jar"
          echo "Docker Image ID to potentially push: localbuild/huddey-core:${{ github.sha }}"
          # Add real deployment steps here (docker login, push, kubectl/helm etc.)
          echo "Deployment simulation complete."