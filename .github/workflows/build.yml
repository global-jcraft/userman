# .github/workflows/build.yml

name: Build, Test, Scan and Deploy Dev

on:
  push:
    branches:
      - master
      - develop
      - '**' # Trigger on push to master, develop, AND any other branch (e.g., feature/xxx)
  pull_request:
    # Trigger on PRs targeting master or develop
    branches:
      - master
      - develop

permissions:
  contents: read
  pull-requests: write # Needed for SonarCloud PR decoration

jobs:
  build-scan-deploy:
    name: Build, Scan & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.9.0
        with:
          egress-policy: audit # Start with audit, then consider block

      - name: Checkout Code
        uses: actions/checkout@v4.1.6
        with:
          # Fetch depth 0 is important for SonarQube branch/PR analysis
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # --- Build Steps ---
      - name: 1. Build Project (Compile sources)
        run: ./gradlew assemble

      - name: 2. SonarCloud Code Quality Scan
        # Runs unconditionally whenever the job runs.
        # SonarScanner detects PRs vs. branch pushes automatically.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed for PR decoration
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Token for SonarCloud
        run: ./gradlew sonarqube --info

      - name: 3. Spotless Check
        run: ./gradlew spotlessCheck

      - name: 4. Unit Tests & Coverage
        run: ./gradlew test # Jacoco report generated via finalizedBy

      - name: 5. Package Application
        run: ./gradlew bootJar

      # --- Docker Steps ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.3.0

      - name: 6. Docker Build
        id: docker_build
        uses: docker/build-push-action@v5.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false # Only build locally for scanning
          # Using SHA for image tag uniqueness within the build
          tags: localbuild/huddey-core:${{ github.sha }}
          load: true # Load image into runner's docker daemon for Snyk scan

      # --- Security Scan ---
      - name: 7.1 Snyk Scan - Application Dependencies
        uses: snyk/actions/gradle@v0.8.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-sub-projects
          # Use 'monitor' to track dependencies or 'test' to fail the build on vulnerabilities
          command: monitor
          # You might want to add severity thresholds if using 'test', e.g., --severity-threshold=high

      - name: 7.2 Snyk Scan - Docker Image
        uses: snyk/actions/docker@v0.8.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: localbuild/huddey-core:${{ github.sha }}
          args: --file=Dockerfile
          # Consider adding severity thresholds here too, e.g., --severity-threshold=high

      # --- Deployment Step ---
      - name: 8. Deploy to Dev Environment (Dummy)
        # ASSUMPTION: Deploying to Dev occurs on pushes to the 'develop' branch.
        # PLEASE CONFIRM/ADJUST this condition based on your actual deployment strategy.
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          echo "Simulating deployment to Dev environment from 'develop' branch..."
          echo "Artifact: build/libs/huddey-core-*.jar"
          echo "Docker Image ID to potentially push: localbuild/huddey-core:${{ github.sha }}"
          # In a real scenario:
          # 1. Login to Docker registry
          # 2. Push the image (e.g., docker push your-registry/huddey-core:some-tag)
          # 3. Trigger deployment (kubectl apply, helm upgrade, etc.)
          echo "Deployment simulation complete."