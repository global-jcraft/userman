services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-high-concurrent
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: huddey_core
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=32MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=300"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "max_worker_processes=12"
      - "-c"
      - "max_parallel_workers_per_gather=6"
      - "-c"
      - "max_parallel_workers=12"
      - "-c"
      - "max_parallel_maintenance_workers=6"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "log_duration=off"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_min_duration_statement=5000"
      - "-c"
      - "autovacuum=on"
      - "-c"
      - "log_autovacuum_min_duration=0"
      - "-c"
      - "autovacuum_max_workers=4"
      - "-c"
      - "autovacuum_naptime=30s"
      - "-c"
      - "statement_timeout=300000"
      - "-c"
      - "lock_timeout=10000"
      - "-c"
      - "idle_in_transaction_session_timeout=60000"
      - "-c"
      - "tcp_keepalives_idle=600"
      - "-c"
      - "tcp_keepalives_interval=60"
      - "-c"
      - "tcp_keepalives_count=10"
      - "-c"
      - "deadlock_timeout=1s"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 3G
        reservations:
          cpus: '2'
          memory: 1G
    networks:
      - huddey-network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer-high-concurrent
    restart: unless-stopped
    ports:
      - "6432:6432"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: dev_password
      DB_NAME: huddey_core
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 3000
      DEFAULT_POOL_SIZE: 100
      RESERVE_POOL_SIZE: 25
      RESERVE_POOL_TIMEOUT: 2
      SERVER_LIFETIME: 1800
      SERVER_IDLE_TIMEOUT: 300
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
      LOG_POOLER_ERRORS: 1
      STATS_PERIOD: 60
      ADMIN_USERS: postgres
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: 6432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - huddey-network

  redis:
    image: redis:7.0-alpine
    container_name: redis-high-concurrent
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 60
      --maxclients 10000
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - huddey-network

  huddey-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: huddey-service
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      # Core Spring Boot configuration
      SPRING_PROFILES_ACTIVE: local

      # Database configuration - override your local.yml
      SPRING_DATASOURCE_URL: jdbc:postgresql://pgbouncer:6432/huddey_core?reWriteBatchedInserts=true&cachePrepStmts=true&useServerPrepStmts=true&prepStmtCacheSize=500&prepStmtCacheSqlLimit=2048&sslmode=disable
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: dev_password

      # Redis configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      # JWT and security
      JWT_SECRET: "${JWT_SECRET:-6PHv2QUPNS5JONxoqZE9OjXEGigrxRmnv9oF0Rt5djVDJCrpnKw01SglgJtmscLITrbw8llxeP2QWt67IxUrE7FDfrsATR8nNG27HO6qk2rqXsN7lYpXddCaScbMRLsi}"

      # OAuth configuration (if needed)
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      FACEBOOK_CLIENT_ID: "${FACEBOOK_CLIENT_ID:-}"
      FACEBOOK_CLIENT_SECRET: "${FACEBOOK_CLIENT_SECRET:-}"

      # Performance tuning
      JAVA_OPTS: >
        -Xms1024m
        -Xmx2048m
        -XX:+UseG1GC
        -XX:MaxRAMPercentage=75.0
        -XX:+UseStringDeduplication
        -XX:+UseCompressedOops
        -XX:+UseCompressedClassPointers
        -XX:MaxMetaspaceSize=256m
        -XX:G1HeapRegionSize=16m
        -XX:InitiatingHeapOccupancyPercent=35
        -Djava.awt.headless=true
        -Dfile.encoding=UTF-8
        -Duser.timezone=UTC

      # Application configuration
      APP_CONFIRMATION_BASEURL: https://localhost:8080/huddey/api/v1/auth/

      # Logging configuration
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_HUDDEY: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: WARN
      LOGGING_LEVEL_ORG_HIBERNATE_TYPE: WARN

      # Actuator configuration
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,metrics,prometheus,info,hikaricp
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always

    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/huddey/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s  # Increased startup time
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    # Add startup delay to wait for PgBouncer
    command: ["sh", "-c", "sleep 30 && java $$JAVA_OPTS -jar app.jar"]
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 3G
        reservations:
          cpus: '2'
          memory: 2G
    networks:
      - huddey-network

networks:
  huddey-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis-data:
    driver: local