plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.sonarqube" version "6.0.0.5145"
    id 'com.diffplug.spotless' version '6.21.0'
    id 'jacoco'
}

allprojects {
    group = 'com.huddey.core'
    version = '0.0.1-SNAPSHOT'
    
    repositories {
        mavenCentral()
    }
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'jacoco'

    bootJar {
        enabled = false
    }

    jar {
        enabled = true
    }
    
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    configurations {
        if (configurations.findByName("annotationProcessor") != null) {
            compileOnly {
                extendsFrom annotationProcessor
            }
        }
        if (configurations.findByName("developmentOnly") == null) {
            developmentOnly
        }
    }
    
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'io.micrometer:micrometer-tracing-bridge-brave'
        implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonDatatypeVersion}"
        implementation "me.paulschwarz:spring-dotenv:${dotenvVersion}"
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        developmentOnly 'org.springframework.boot:spring-boot-devtools'
        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    
    spotless {
        java {
            target 'src/**/*.java'
            googleJavaFormat('1.25.0')
            removeUnusedImports()
            importOrder('java', 'javax', 'org', 'com')
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
    
    tasks.named("build") {
        dependsOn("spotlessCheck")
    }
    
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.matching { it.name == 'prepareKotlinBuildScriptModel' }.configureEach {
        enabled = false
    }

    jacocoTestReport {
        reports {
            xml.required = true
            html.required = true
        }
        dependsOn test
    }
    
    test {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }
}

sonar {
    properties {
        property "sonar.projectKey", "global-jcraft_userman"
        property "sonar.organization", "global-jcraft"
        property "sonar.host.url", "https://sonarcloud.io"
    }
}